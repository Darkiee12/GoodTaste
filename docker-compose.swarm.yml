# Dokploy swarm stack TEMPLATE — never deployed directly.
#
# CI renders an immutable copy (pinned GHCR image SHAs) and pushes it with
#   POST /api/compose.update {composeId, sourceType: "raw", composeType: "stack"}
# then rolls it out with POST /api/compose.deploy {composeId, ...}.
# Dokploy Compose service: source Raw, compose type Stack.
#
# Template parameters (substituted by the render script, never by hand):
#   GHCR_IMAGE_PREFIX  e.g. ghcr.io/darkiee12
#   VERSION            e.g. sha-<40-hex> (rollback: any immutable tag)
# Every other ${VAR} is runtime configuration from the Dokploy stack
# environment UI. `:?` fails the deploy fast with a named variable.
#
# Local structural validation only (never deploys prod data):
#   VERSION=test GHCR_IMAGE_PREFIX=ghcr.io/example \
#   POSTGRES_USER=u POSTGRES_PASSWORD=p POSTGRES_DB=db \
#   BETTER_AUTH_URL=https://example.test BETTER_AUTH_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
#   GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=x FACEBOOK_CLIENT_ID=x FACEBOOK_CLIENT_SECRET=x \
#   SMTP_HOST=x SMTP_PORT=587 SMTP_USERNAME=x SMTP_PASSWORD=x EMAIL_FROM=x@example.test \
#   APP_HOST=example.test GARAGE_RPC_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
#   GARAGE_BOOTSTRAP_ACCESS_KEY=x GARAGE_BOOTSTRAP_SECRET_KEY=x \
#   S3_ACCESS_KEY_ID=x S3_SECRET_ACCESS_KEY=x \
#   docker compose -f docker-compose.swarm.yml config --quiet
#
# Storage prerequisite (operator, once per Swarm): label exactly one durable
# node and create no volumes by hand (Swarm creates them on first deploy):
#   docker node update --label-add feastjourney-storage=true <node-name>
# Garage is pinned to that node; losing the node loses unreplicated objects
# unless restored from backup (see docs/infra/object-storage.md).

x-app-security: &app-security
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:exec,mode=1777
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-restart-policy: &restart-policy
  condition: any
  delay: 5s

services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    security_opt:
      - no-new-privileges:true
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - infra
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:?POSTGRES_USER must be set} -d ${POSTGRES_DB:?POSTGRES_DB must be set}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
      restart_policy: *restart-policy

  # One-shot gate: runs migrations to completion BEFORE the app rolls out
  # (see the app's start-first update below), then exits. `none` keeps a
  # successful exit from restarting. Never `repair`/`clean` here.
  migrator:
    <<: *app-security
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX must be set}/feastjourney-migrator:${VERSION:?VERSION must be set}
    networks:
      - infra
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      FLYWAY_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      FLYWAY_SCHEMAS: feastjourney
      FLYWAY_DEFAULT_SCHEMA: feastjourney
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
    deploy:
      replicas: 1
      restart_policy:
        condition: none

  # First-party S3-compatible object storage (single node, NOT highly
  # available). Config is baked into the immutable Garage image; only secrets
  # and the bucket name arrive as runtime environment. No `ports`: the S3 API
  # is reachable only inside the `infra` overlay at http://garage:3900.
  # No admin/RPC listeners are exposed. Both volumes are persistent and the
  # service is pinned to the single labeled durable-storage node: rescheduling
  # elsewhere with empty volumes would start with no objects, so the
  # constraint fails closed instead of silently creating an empty store.
  garage:
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX must be set}/feastjourney-garage:${VERSION:?VERSION must be set}
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    security_opt:
      - no-new-privileges:true
    networks:
      - infra
    expose:
      - "3900"
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?GARAGE_RPC_SECRET must be set}
      GARAGE_DEFAULT_ACCESS_KEY: ${GARAGE_BOOTSTRAP_ACCESS_KEY:?GARAGE_BOOTSTRAP_ACCESS_KEY must be set}
      GARAGE_DEFAULT_SECRET_KEY: ${GARAGE_BOOTSTRAP_SECRET_KEY:?GARAGE_BOOTSTRAP_SECRET_KEY must be set}
      GARAGE_DEFAULT_BUCKET: ${S3_BUCKET_PRIVATE:-feastjourney-private}
    volumes:
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.feastjourney-storage == true
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
      restart_policy: *restart-policy

  app:
    <<: *app-security
    image: ${GHCR_IMAGE_PREFIX:?GHCR_IMAGE_PREFIX must be set}/feastjourney:${VERSION:?VERSION must be set}
    networks:
      - dokploy-network
      - internal
      - infra
    expose:
      - "3000"
    environment:
      # Inside this network the database is `postgres:5432`. Keep passwords
      # free of URL-special characters (`@`, `:`, `/`) or percent-encode them.
      DATABASE_URL: postgres://${POSTGRES_USER:?POSTGRES_USER must be set}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB must be set}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL must be the exact public https origin, no trailing slash}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID must be set}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET must be set}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:?FACEBOOK_CLIENT_ID must be set}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:?FACEBOOK_CLIENT_SECRET must be set}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:?SMTP_PORT must be set}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      EMAIL_FROM: ${EMAIL_FROM:?EMAIL_FROM must be set}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-60}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-20}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-10}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-15000}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      RECOMMENDATION_PROVIDER: ${RECOMMENDATION_PROVIDER:-deterministic}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_MODEL_ID: ${MODEL_MODEL_ID:-muse-spark-1.3}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.meta.ai/v1}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-15000}
      MODEL_CANDIDATE_LIMIT: ${MODEL_CANDIDATE_LIMIT:-60}
      MODEL_OUTPUT_LIMIT: ${MODEL_OUTPUT_LIMIT:-10}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
      # First-party object storage over the internal Swarm network. The app
      # never holds Garage admin/RPC credentials: S3_* below is the
      # least-privilege app key provisioned via garage-provision.sh and stored
      # as Dokploy secrets. Endpoint is fixed internal DNS; buckets default to
      # the private bucket and stay private (public delivery is the
      # same-origin /api/v1/dish-images route, never the bucket).
      S3_ENDPOINT_INTERNAL: http://garage:3900
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET_PRIVATE: ${S3_BUCKET_PRIVATE:-feastjourney-private}
      S3_BUCKET_MEDIA: ${S3_BUCKET_MEDIA:-feastjourney-private}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?S3_ACCESS_KEY_ID must be set}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?S3_SECRET_ACCESS_KEY must be set}
    deploy:
      replicas: 1
      labels:
        traefik.enable: "true"
        traefik.swarm.network: dokploy-network
        traefik.http.routers.feastjourney.rule: "Host(`${APP_HOST:?APP_HOST must be the public hostname}`)"
        traefik.http.routers.feastjourney.entrypoints: websecure
        traefik.http.routers.feastjourney.tls.certresolver: letsencrypt
        traefik.http.services.feastjourney.loadbalancer.server.port: "3000"
      update_config:
        order: start-first
        parallelism: 1
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
        parallelism: 1
      restart_policy: *restart-policy
    # Liveness comes from the image itself (bun fetch /health/live);
    # readiness (/health/ready) is for humans and the deploy wait loop,
    # never the restart loop — a wedged database must not flap the container.

volumes:
  postgres_data:
    driver: local
  # Garage persistence: BOTH volumes must survive restarts/reschedules on the
  # same labeled node. Metadata and object data are never container-local
  # ephemeral storage. Losing either volume loses objects; restore both from
  # the same backup set (see docs/infra/object-storage.md). Single node only.
  garage_meta:
    driver: local
  garage_data:
    driver: local

networks:
  dokploy-network:
    external: true
  internal:
    driver: overlay
    attachable: true
  infra:
    driver: overlay
    attachable: true
    internal: true
