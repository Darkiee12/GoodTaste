name: Quality
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static:
    name: Format and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Formatting
        run: bun run format
      - name: Type-aware lint
        run: bun run lint

  backend:
    name: PostgreSQL-backed typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Disposable CI-only values (fresh Postgres per run, test-only admin key).
      DATABASE_URL: postgres://feastjourney:replace-with-strong-local-only-password@127.0.0.1:5433/feastjourney
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_PROXIES: ""
      # Fill real values under Settings → Secrets and variables → Actions.
      # Unset secrets arrive as empty strings and the test setup substitutes
      # documented non-secret stubs (tests use an in-memory mail sender and
      # never call real providers). `||=` in tests/integration/cleanup.ts
      # means provided secrets always take precedence.
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
      FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start disposable PostgreSQL with loopback access
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml up -d --wait postgres
      - name: Run Flyway migrations
        run: docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml run --rm migrator
      - name: Validate Flyway migration history
        run: docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml run --rm migrator validate
      - name: Reylo-aware TypeScript
        run: bun run check-types
      - name: Unit and integration tests
        run: bun test tests/
      - name: Production build
        run: bun run build
      - name: Stop disposable services
        if: always()
        run: docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml down --remove-orphans

  audit:
    name: Dependency and code audits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Dependency vulnerabilities
        run: bun run audit:dependencies
      - name: AI slop gate
        run: bun run audit:slop
      - name: React Doctor
        run: bun run audit:react-doctor
      - name: React Compiler readiness
        run: bun run audit:react-compiler

  migration:
    name: PostgreSQL 18 + Flyway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate local Compose configuration
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml config --quiet
      - name: Start disposable PostgreSQL
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml up -d --wait postgres
      - name: Run Flyway migrations
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml run --rm migrator
      - name: Verify PostGIS extension and spatial operation
        run: |
          docker compose --env-file infra/.env.example -f infra/compose.yaml exec -T postgres sh -ec 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -X -v ON_ERROR_STOP=1 -c "SELECT postgis_version(), ST_DWithin(ST_SetSRID(ST_MakePoint(106.7, 10.8), 4326)::geography, ST_SetSRID(ST_MakePoint(106.7, 10.8), 4326)::geography, 100.0);"'
      - name: Validate Flyway migration history
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml run --rm migrator validate
      - name: Check idempotent versioned migration pass
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml run --rm migrator
      - name: Stop disposable services
        if: always()
        run: docker compose --env-file infra/.env.example -f infra/compose.yaml down --remove-orphans

  garage:
    name: Garage S3 swarm integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Garage image (immutable, config-baked)
        run: docker build -f infra/Dockerfile.garage -t feastjourney-garage:ci .
      - name: Render pinned Swarm stack with disposable tag
        run: |
          node .github/workflows/scripts/render-release-stack.mjs \
            --version test-garage-ci \
            --prefix ghcr.io/example \
            --in docker-compose.swarm.yml \
            --out /tmp/docker-compose.garage-ci.yml
          test -f /tmp/docker-compose.garage-ci.yml
          grep -q 'feastjourney-garage:test-garage-ci' /tmp/docker-compose.garage-ci.yml
          grep -q 'feastjourney-migrator:test-garage-ci' /tmp/docker-compose.garage-ci.yml
          grep -q 'feastjourney:test-garage-ci' /tmp/docker-compose.garage-ci.yml
      - name: Validate rendered Swarm stack with disposable secrets
        run: |
          VERSION=test GHCR_IMAGE_PREFIX=ghcr.io/example \
          POSTGRES_USER=u POSTGRES_PASSWORD=p POSTGRES_DB=db \
          BETTER_AUTH_URL=https://example.test BETTER_AUTH_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
          GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=x FACEBOOK_CLIENT_ID=x FACEBOOK_CLIENT_SECRET=x \
          SMTP_HOST=x SMTP_PORT=587 SMTP_USERNAME=x SMTP_PASSWORD=x EMAIL_FROM=x@example.test \
          APP_HOST=example.test GARAGE_RPC_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
          GARAGE_BOOTSTRAP_ACCESS_KEY=x GARAGE_BOOTSTRAP_SECRET_KEY=x \
          S3_ACCESS_KEY_ID=x S3_SECRET_ACCESS_KEY=x \
          docker compose -f /tmp/docker-compose.garage-ci.yml config --quiet
      - name: Required S3 secrets fail closed without values
        run: |
          # Each case omits exactly one credential while supplying a
          # disposable single-char value for the other, so a non-zero exit
          # necessarily proves THAT variable is required. No message-text
          # grep: compose interpolation-error wording varies by version, and
          # the exit code is the fail-closed proof. Captured output holds
          # only interpolation errors with placeholder values; no real
          # secrets ever reach this step.
          base_env() {
            env \
              VERSION=test GHCR_IMAGE_PREFIX=ghcr.io/example \
              POSTGRES_USER=u POSTGRES_PASSWORD=p POSTGRES_DB=db \
              BETTER_AUTH_URL=https://example.test BETTER_AUTH_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
              GOOGLE_CLIENT_ID=x GOOGLE_CLIENT_SECRET=x FACEBOOK_CLIENT_ID=x FACEBOOK_CLIENT_SECRET=x \
              SMTP_HOST=x SMTP_PORT=587 SMTP_USERNAME=x SMTP_PASSWORD=x EMAIL_FROM=x@example.test \
              APP_HOST=example.test GARAGE_RPC_SECRET=xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx \
              GARAGE_BOOTSTRAP_ACCESS_KEY=x GARAGE_BOOTSTRAP_SECRET_KEY=x \
              "$@"
          }
          check_missing() {
            missing="$1"
            log="$2"
            shift 2
            echo "--- expecting failure without ${missing} ---"
            if base_env "$@" docker compose -f /tmp/docker-compose.garage-ci.yml config --quiet 2>"$log"; then
              echo "error: rendered stack validated without ${missing}" >&2
              return 1
            fi
            echo "compose refused without ${missing}; captured output:"
            cat "$log"
            if grep -q "$missing" "$log"; then
              echo "(output names ${missing})"
            else
              echo "(output does not name it; exit-code refusal is the proof)"
            fi
            echo "ok: missing ${missing} fails the render"
          }
          check_missing S3_ACCESS_KEY_ID /tmp/garage-missing-id.log S3_SECRET_ACCESS_KEY=x
          check_missing S3_SECRET_ACCESS_KEY /tmp/garage-missing-secret.log S3_ACCESS_KEY_ID=x
      - name: Isolated Garage S3 round-trip, anon denial, restart persistence
        run: bash infra/scripts/garage-verify.sh
      - name: Dish-photo pipeline against disposable Garage + Postgres
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml up -d --wait postgres
          docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml run --rm migrator
          RPC_SECRET="$(openssl rand -hex 32)"
          APP_ID="GK$(openssl rand -hex 16)"
          APP_SECRET="$(openssl rand -hex 32)"
          BUCKET="ci-garage-dish-media"
          docker volume create ci_garage_meta >/dev/null
          docker volume create ci_garage_data >/dev/null
          docker run -d --name ci-garage \
            -e GARAGE_RPC_SECRET="$RPC_SECRET" \
            -e GARAGE_DEFAULT_ACCESS_KEY="$APP_ID" \
            -e GARAGE_DEFAULT_SECRET_KEY="$APP_SECRET" \
            -e GARAGE_DEFAULT_BUCKET="$BUCKET" \
            -v ci_garage_meta:/var/lib/garage/meta \
            -v ci_garage_data:/var/lib/garage/data \
            -p 127.0.0.1:13902:3900 \
            feastjourney-garage:ci \
            /garage server --single-node --default-bucket >/dev/null
          deadline=$((SECONDS + 60))
          while [ $SECONDS -lt $deadline ]; do
            if S3_ENDPOINT="http://127.0.0.1:13902" S3_REGION=garage S3_BUCKET="$BUCKET" \
              S3_ACCESS_KEY_ID="$APP_ID" S3_SECRET_ACCESS_KEY="$APP_SECRET" \
              S3_TEST_PREFIX="ci-ready" node infra/scripts/garage-s3-check.mjs >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          DATABASE_URL=postgres://feastjourney:replace-with-strong-local-only-password@127.0.0.1:5433/feastjourney \
          S3_ENDPOINT_INTERNAL="http://127.0.0.1:13902" S3_ENDPOINT="http://127.0.0.1:13902" \
          S3_REGION=garage S3_BUCKET_PRIVATE="$BUCKET" S3_BUCKET_MEDIA="$BUCKET" \
          S3_ACCESS_KEY_ID="$APP_ID" S3_SECRET_ACCESS_KEY="$APP_SECRET" \
          bun test tests/integration/garage-s3.test.ts tests/dish-media.test.ts
      - name: Stop disposable services
        if: always()
        run: |
          docker rm -f ci-garage >/dev/null 2>&1 || true
          docker volume rm ci_garage_meta ci_garage_data >/dev/null 2>&1 || true
          docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml down --remove-orphans >/dev/null 2>&1 || true
