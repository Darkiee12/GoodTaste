# Release: quality gate -> verified artifact -> GHCR images -> Dokploy stack.
#
# What this workflow is and is NOT:
# - It DUPLICATES the quality.yml backend flow on purpose (same disposable
#   PG18+PostGIS, same migrate -> validate -> check-types -> tests -> build)
#   so the published images always embed the .output artifact that the gate
#   verified, from the same commit. It never edits quality.yml.
# - Triggers: push to `main` (auto-deploys staging after the gate), version
#   tags (v*.*.*), and workflow_dispatch. There is no pull_request trigger,
#   so fork PRs can neither run this workflow nor reach its secrets.
#   Production deploys are NEVER automated: after staging verification a
#   human promotes the SHA tag in Dokploy.
# - The builder never touches the production database (disposable CI Postgres
#   only). No privileged secret is available to untrusted code paths.
# - Staging rolls out as an immutable Dokploy stack: CI renders
#   docker-compose.swarm.yml with pinned GHCR tags
#   (compose.update, sourceType raw), then queues the rollout
#   (compose.deploy) and waits for it. No mutable tags, no SSH.
#
# Required repository setup (operator, once):
# - GitHub environment `staging` with secrets: DOKPLOY_URL,
#   DOKPLOY_API_KEY (deploy-scoped x-api-key), DOKPLOY_COMPOSE_ID (the
#   Dokploy Compose service id, NOT the project id — find it in the service
#   URL or via GET /api/project.all), CF_ACCESS_CLIENT_ID,
#   CF_ACCESS_CLIENT_SECRET (Cloudflare Access service token allowed ONLY
#   on the Dokploy dashboard path).
# - GHCR: nothing to configure; GITHUB_TOKEN with job-level packages:write
#   publishes ghcr.io/<owner-lowercase>/feastjourney{,-migrator}. Dokploy
#   pulls with its own registry credential — never the publish token.

name: Release
on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "After publishing, trigger the Dokploy staging rollout. Pushes to main deploy automatically; use this for rollbacks (with image_tag) or tag rebuilds."
        required: false
        default: "false"
      image_tag:
        description: "Redeploy an existing image tag to staging instead of the just-built SHA (rollback path). Empty = use the just-built SHA."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_VERSION: 1.4.4
  GHCR_REGISTRY: ghcr.io

jobs:
  quality:
    name: Quality gate and verified build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Disposable CI-only values (fresh Postgres per run).
      DATABASE_URL: postgres://feastjourney:replace-with-strong-local-only-password@127.0.0.1:5433/feastjourney
      BETTER_AUTH_URL: http://localhost:3000
      TRUSTED_PROXIES: ""
      # Fill under Settings -> Secrets and variables -> Actions. Unset secrets
      # arrive empty and the test setup substitutes documented non-secret stubs
      # (tests use an in-memory mail sender and never call real providers).
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FACEBOOK_CLIENT_ID: ${{ secrets.FACEBOOK_CLIENT_ID }}
      FACEBOOK_CLIENT_SECRET: ${{ secrets.FACEBOOK_CLIENT_SECRET }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Start disposable PostgreSQL with loopback access
        run: |
          cp infra/.env.example infra/.env
          docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml up -d --wait postgres
      - name: Run Flyway migrations
        run: docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml run --rm migrator
      - name: Validate Flyway migration history
        run: docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml run --rm migrator validate
      - name: Reylo-aware TypeScript
        run: bun run check-types
      - name: Unit and integration tests
        run: bun test tests/
      - name: Production build
        run: bun run build
      - name: Prove the build artifact is self-contained
        run: |
          test -f .output/server/index.mjs
          test -d .output/public
          ls -la .output
          du -sh .output
          find .output/server -maxdepth 1 | head
      - name: Upload verified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: verified-output-${{ github.sha }}
          path: .output
          retention-days: 14
          # Default is warn-on-empty, which silently publishes nothing and
          # fails the build-image job minutes later with a confusing
          # "artifact not found". Fail here, where the evidence is fresh.
          if-no-files-found: error
      - name: Failure diagnostics (no secrets)
        if: failure()
        run: |
          docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml ps
          docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml run --rm migrator info || true
          ls .output/server 2>/dev/null || echo "no .output/server (build never completed)"
      - name: Stop disposable services
        if: always()
        run: docker compose --env-file infra/.env -f infra/compose.yaml -f infra/compose.ports.yaml down --remove-orphans

  publish:
    name: Build and push production images
    needs: quality
    # Pushes to main, tags, and manual runs publish the verified result.
    # PRs cannot reach this job (no PR trigger above).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # App: packages ONLY the CI-verified .output artifact plus
          # production-only dependencies (see infra/Dockerfile.prod).
          - service: feastjourney
            dockerfile: infra/Dockerfile.prod
            needs_output: "true"
          # Migrator: Flyway plus the versioned migrations baked in — no
          # volume mounts, so the raw Dokploy stack is self-contained.
          - service: feastjourney-migrator
            dockerfile: infra/Dockerfile.migrator
            needs_output: "false"
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Download verified build artifact
        if: matrix.needs_output == 'true'
        uses: actions/download-artifact@v4
        with:
          name: verified-output-${{ github.sha }}
          path: .output
      - name: Prove artifact integrity before packaging
        if: matrix.needs_output == 'true'
        run: test -f .output/server/index.mjs
      - name: Resolve image name (lowercase, SHA tags only — never latest)
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          image="${{ env.GHCR_REGISTRY }}/${owner}/${{ matrix.service }}"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${image}:sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "ref_tag=${image}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref_tag=" >> "$GITHUB_OUTPUT"
          fi
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.GHCR_REGISTRY }} -u ${{ github.actor }} --password-stdin
      - name: Build production image (verified artifact only)
        run: |
          tags="-t ${{ steps.meta.outputs.sha_tag }}"
          if [ -n "${{ steps.meta.outputs.ref_tag }}" ]; then
            tags="$tags -t ${{ steps.meta.outputs.ref_tag }}"
          fi
          # shellcheck disable=SC2086
          docker build -f ${{ matrix.dockerfile }} $tags .
      - name: Push image
        run: |
          docker push ${{ steps.meta.outputs.sha_tag }}
          if [ -n "${{ steps.meta.outputs.ref_tag }}" ]; then
            docker push ${{ steps.meta.outputs.ref_tag }}
          fi
      - name: Failure diagnostics (no secrets)
        if: failure()
        run: |
          docker images "${{ steps.meta.outputs.image }}" || true
          ls .output/server 2>/dev/null || echo "no .output/server"

  deploy:
    name: Deploy immutable stack to staging
    needs: publish
    # Pushes to main auto-deploy staging after the gate passes. Manual
    # dispatch with deploy_staging=true deploys main too, or
    # inputs.image_tag for rollbacks (the gate for that tag ran when it
    # was published). PRs never reach this job.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_staging == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tag (fresh SHA or operator rollback tag)
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
            echo "Rollback redeploy requested: ${{ inputs.image_tag }} (quality gate for that tag ran when it was published)"
          else
            echo "value=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Render pinned stack
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          node .github/workflows/scripts/render-release-stack.mjs \
            --version "${{ steps.tag.outputs.value }}" \
            --prefix "${{ env.GHCR_REGISTRY }}/${owner}" \
            --in docker-compose.swarm.yml \
            --out /tmp/docker-compose.release.yml
      - name: Update Dokploy stack definition
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${DOKPLOY_URL:?DOKPLOY_URL is not set}"
          : "${DOKPLOY_API_KEY:?DOKPLOY_API_KEY is not set}"
          : "${DOKPLOY_COMPOSE_ID:?DOKPLOY_COMPOSE_ID is not set}"
          : "${CF_ACCESS_CLIENT_ID:?CF_ACCESS_CLIENT_ID is not set}"
          : "${CF_ACCESS_CLIENT_SECRET:?CF_ACCESS_CLIENT_SECRET is not set}"
          base_url="${DOKPLOY_URL%/}"

          jq -n \
            --arg composeId "${DOKPLOY_COMPOSE_ID}" \
            --rawfile composeFile /tmp/docker-compose.release.yml \
            '{composeId: $composeId, sourceType: "raw", composeType: "stack", composeFile: $composeFile}' \
            > /tmp/dokploy-update.json

          # shellcheck disable=SC2086
          if ! http_code="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 60 \
              --request POST \
              --header "x-api-key: ${DOKPLOY_API_KEY}" \
              --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/dokploy-update.json \
              "${base_url}/api/compose.update"
          )"; then
            echo "::error::Could not reach Dokploy while updating the stack definition"
            exit 1
          fi

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Dokploy compose.update failed with HTTP ${http_code}"
            exit 1
          fi

          echo "Dokploy stack definition updated."
      - name: Queue Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          : "${DOKPLOY_URL:?DOKPLOY_URL is not set}"
          : "${DOKPLOY_API_KEY:?DOKPLOY_API_KEY is not set}"
          : "${DOKPLOY_COMPOSE_ID:?DOKPLOY_COMPOSE_ID is not set}"
          : "${CF_ACCESS_CLIENT_ID:?CF_ACCESS_CLIENT_ID is not set}"
          : "${CF_ACCESS_CLIENT_SECRET:?CF_ACCESS_CLIENT_SECRET is not set}"

          base_url="${DOKPLOY_URL%/}"
          short_sha="${GITHUB_SHA::12}"
          deploy_marker="github-actions:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}"

          jq -n \
            --arg composeId "${DOKPLOY_COMPOSE_ID}" \
            --arg title "Deploy ${short_sha} (${{ steps.tag.outputs.value }})" \
            --arg description "${deploy_marker}" \
            '{composeId: $composeId, title: $title, description: $description}' \
            > /tmp/dokploy-deploy.json

          if ! http_code="$(
            curl \
              --silent \
              --show-error \
              --output /dev/null \
              --write-out '%{http_code}' \
              --connect-timeout 10 \
              --max-time 60 \
              --request POST \
              --header "x-api-key: ${DOKPLOY_API_KEY}" \
              --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
              --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/dokploy-deploy.json \
              "${base_url}/api/compose.deploy"
          )"; then
            echo "::error::Could not reach Dokploy while queueing deployment"
            exit 1
          fi

          if [[ ! "${http_code}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Dokploy compose.deploy failed with HTTP ${http_code}"
            exit 1
          fi

          echo "DEPLOY_MARKER=${deploy_marker}" >> "${GITHUB_ENV}"
          echo "Dokploy deployment queued."
      - name: Wait for Dokploy deployment
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_COMPOSE_ID }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          base_url="${DOKPLOY_URL%/}"
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT

          deployment_id=""
          deadline=$((SECONDS + 600))

          while (( SECONDS < deadline )); do
            if ! http_code="$(
              curl \
                --silent \
                --show-error \
                --output "${response_file}" \
                --write-out '%{http_code}' \
                --connect-timeout 10 \
                --max-time 30 \
                --get \
                --header "x-api-key: ${DOKPLOY_API_KEY}" \
                --header "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" \
                --header "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" \
                --data-urlencode "composeId=${DOKPLOY_COMPOSE_ID}" \
                "${base_url}/api/deployment.allByCompose"
            )"; then
              echo "::warning::Could not query Dokploy deployment status; retrying"
              sleep 5
              continue
            fi

            if [[ "${http_code}" =~ ^4[0-9][0-9]$ ]]; then
              echo "::error::Dokploy deployment status request failed with HTTP ${http_code}"
              exit 1
            fi

            if [[ "${http_code}" != "200" ]]; then
              echo "::warning::Dokploy deployment status returned HTTP ${http_code}; retrying"
              sleep 5
              continue
            fi

            if ! jq -e 'type == "array"' "${response_file}" > /dev/null; then
              echo "::error::Dokploy returned an unexpected deployment status response"
              exit 1
            fi

            if [[ -z "${deployment_id}" ]]; then
              deployment_id="$(
                jq -r \
                  --arg marker "${DEPLOY_MARKER}" \
                  '([.[] | select(.description == $marker)][0].deploymentId // "")' \
                  "${response_file}"
              )"

              if [[ -z "${deployment_id}" ]]; then
                echo "Waiting for Dokploy to start the queued deployment..."
                sleep 5
                continue
              fi

              echo "Tracking Dokploy deployment ${deployment_id}"
            fi

            status="$(
              jq -r \
                --arg id "${deployment_id}" \
                '([.[] | select(.deploymentId == $id)][0].status // "")' \
                "${response_file}"
            )"

            case "${status}" in
              running)
                echo "Dokploy deployment ${deployment_id} is still running..."
                ;;
              done)
                echo "Dokploy deployment ${deployment_id} succeeded."
                {
                  echo "### Staging deployment"
                  echo
                  echo "- Status: ✅ successful"
                  echo "- Commit: \`${GITHUB_SHA}\`"
                  echo "- Dokploy deployment: \`${deployment_id}\`"
                } >> "${GITHUB_STEP_SUMMARY}"
                exit 0
                ;;
              error)
                echo "::error::Dokploy deployment ${deployment_id} failed"
                exit 1
                ;;
              cancelled)
                echo "::error::Dokploy deployment ${deployment_id} was cancelled"
                exit 1
                ;;
              "")
                echo "::warning::Deployment ${deployment_id} was not present in the latest response"
                ;;
              *)
                echo "::warning::Deployment ${deployment_id} has unknown status '${status}'"
                ;;
            esac

            sleep 5
          done

          echo "::error::Timed out waiting for Dokploy deployment to finish"
          exit 1
