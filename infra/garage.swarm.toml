# Swarm / production Garage configuration — baked into the immutable image.
# Secrets NEVER live here: RPC secret and S3 bootstrap keys arrive only via
# Swarm/Dokploy environment (GARAGE_RPC_SECRET, GARAGE_DEFAULT_*).
# Single-node topology: replication_factor 1, no redundancy. See ADR 0004
# and docs/infra/object-storage.md for durability limits and backup procedure.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1

rpc_bind_addr = "127.0.0.1:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "0.0.0.0:3900"
# No root_domain: clients use path-style requests.
# Website and HTTP administration endpoints are intentionally disabled.
