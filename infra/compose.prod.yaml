# Production topology for FeastJourney: treat `main` as production.
#
# Services: PostGIS database (persistent volume), one-shot Flyway migrator
# (must complete before the app starts), and the app itself from the
# CI-verified GHCR image. No Garage/object storage in production (see
# docs/architecture/recommendations.md: dish photography is local-only).
#
# Usage (single host, Docker Compose):
#   cp infra/.env.production.example infra/.env.production
#   # fill in real values, then:
#   docker compose --env-file infra/.env.production -f infra/compose.prod.yaml up -d --wait
#   # migrate first on a fresh database (the app refuses to boot unmigrated):
#   docker compose --env-file infra/.env.production -f infra/compose.prod.yaml run --rm migrator migrate
#   # then start everything (migrator gates the app on every deploy):
#   docker compose --env-file infra/.env.production -f infra/compose.prod.yaml up -d
#
# Dokploy (Compose provider): point the service at this file
# (`infra/compose.prod.yaml` on branch `main`), turn OFF auto-deploy/push
# triggers so the GHCR `:sha-` tag from the release workflow owns rollouts,
# and set every variable below in the Dokploy environment UI. Traefik
# routes the domain to the `app` service port 3000; publish nothing
# publicly from this file.
#
# Swarm: the same file deploys with `docker stack deploy`, except
# `depends_on` conditions are ignored there — run the migrator as an
# explicit one-shot job BEFORE the first stack deploy and before every
# migration-carrying release.

services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrator:
    image: flyway/flyway:13.11.1
    command: ["-connectRetries=60", "migrate"]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      FLYWAY_SCHEMAS: feastjourney
      FLYWAY_DEFAULT_SCHEMA: feastjourney
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_CLEAN_DISABLED: "true"
    volumes:
      - ../db/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    # One-shot gate: runs to completion on every deploy, never a daemon.
    # Never enable `repair`/`clean` here; those are operator actions.
    restart: "no"

  app:
    # CI-verified image only — never `latest`, never a local build.
    # Example: ghcr.io/darkiee12/feastjourney:sha-<commit>.
    image: ${APP_IMAGE:?Set APP_IMAGE to the CI-pushed GHCR tag}
    environment:
      # Inside this network the database is `postgres:5432`. Keep passwords
      # free of URL-special characters (`@`, `:`, `/`) or percent-encode
      # them; derived here so the role exists in exactly one place.
      DATABASE_URL: postgres://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL (exact https origin, no trailing slash)}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:?Set FACEBOOK_CLIENT_ID}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:?Set FACEBOOK_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD}
      EMAIL_FROM: ${EMAIL_FROM:?Set EMAIL_FROM}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      RATE_LIMIT_PUBLIC: ${RATE_LIMIT_PUBLIC:-60}
      RATE_LIMIT_SEARCH: ${RATE_LIMIT_SEARCH:-20}
      RATE_LIMIT_ADMIN: ${RATE_LIMIT_ADMIN:-10}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-15000}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      RECOMMENDATION_PROVIDER: ${RECOMMENDATION_PROVIDER:-deterministic}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_MODEL_ID: ${MODEL_MODEL_ID:-muse-spark-1.3}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.meta.ai/v1}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-15000}
      MODEL_CANDIDATE_LIMIT: ${MODEL_CANDIDATE_LIMIT:-60}
      MODEL_OUTPUT_LIMIT: ${MODEL_OUTPUT_LIMIT:-10}
      MODEL_MAX_TOKENS: ${MODEL_MAX_TOKENS:-4000}
    depends_on:
      migrator:
        condition: service_completed_successfully
    # No published ports: ingress arrives via the platform reverse proxy
    # (Dokploy Traefik) to port 3000. Never map 3000 to the host publicly.
    restart: unless-stopped

volumes:
  postgres_data:
